<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Smart Control POS - Savdo va Boshqaruv Tizimi">
    <title>Smart Control - Kirish</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        secondary: {
                            DEFAULT: "hsl(var(--secondary))",
                            foreground: "hsl(var(--secondary-foreground))",
                        },
                        destructive: {
                            DEFAULT: "hsl(var(--destructive))",
                            foreground: "hsl(var(--destructive-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                        accent: {
                            DEFAULT: "hsl(var(--accent))",
                            foreground: "hsl(var(--accent-foreground))",
                        },
                    },
                    borderRadius: {
                        lg: "0.5rem",
                        md: "calc(0.5rem - 2px)",
                        sm: "calc(0.5rem - 4px)",
                    },
                },
            },
        }
    </script>

    <!-- Shadcn Components CSS -->
    <link rel="stylesheet" href="./assets/shadcn-components.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-[#4a7c44] to-[#2d4a2a] text-slate-950 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Card -->
        <div class="card p-8 space-y-6 bg-white border border-slate-200 shadow-2xl shadow-black/25 rounded-2xl">
            <!-- Logo -->
            <div class="flex flex-col space-y-2 text-center">
                <h1 class="text-2xl font-semibold tracking-tight text-[#2d4a2a]">
                    Smart Control
                </h1>
                <p class="text-sm text-slate-900 font-semibold">
                    Tizimga kirish uchun ma'lumotlaringizni kiriting
                </p>
            </div>

            <!-- Error Alert (hidden by default) -->
            <div id="error-box" class="alert alert-destructive hidden">
                <div class="flex items-start gap-2">
                    <svg class="h-4 w-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span id="error-text" class="text-sm"></span>
                </div>
            </div>

            <!-- Form -->
            <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <!-- Username Field -->
                <div class="space-y-2">
                    <label for="username" class="label text-gray-600">
                        Foydalanuvchi nomi
                    </label>
                    <input type="text" id="username" name="username" class="input bg-gray-50 border-gray-200"
                        placeholder="admin" autocomplete="username" required />
                </div>

                <!-- Password Field -->
                <div class="space-y-2">
                    <label for="password" class="label text-gray-600">
                        Parol
                    </label>
                    <input type="password" id="password" name="password" class="input bg-gray-50 border-gray-200"
                        placeholder="••••••••" autocomplete="current-password" required />
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="btn btn-default w-full bg-[#4a7c44] hover:bg-[#5a9c54] transition-all active:scale-95 text-white rounded-lg"
                    id="btn-submit">
                    Kirish
                </button>
            </form>

            <!-- Footer -->
            <div class="text-center text-sm text-muted">
                <p>Enterprise POS v4.0</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errorBox = document.getElementById("error-box");
            const errorText = document.getElementById("error-text");
            const submitBtn = document.getElementById("btn-submit");

            // Reset error
            errorBox.classList.add("hidden");

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner mr-2"></span> Kirish...';

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: new URLSearchParams({
                        username: username,
                        password: password
                    })
                });

                if (!response.ok) {
                    let errorMessage = "Login xatosi";
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.detail || errorData.message || errorMessage;
                    } catch (e) {
                        errorMessage = `Xatolik: ${response.status} ${response.statusText}`;
                    }
                    throw new Error(errorMessage);
                }

                const data = await response.json();
                console.log("Server Response:", data);

                const token = data.access_token || data.token;
                const user = data.user || {};
                const role = data.role || user.role;
                const username_from_data = data.username || user.username;
                const userId = data.id || user.id;

                if (!token || !role) {
                    console.error("Invalid response structure - missing token or role:", data);
                    throw new Error("Server javobida xatolik: token yoki rol mavjud emas");
                }

                localStorage.setItem("access_token", token);
                const normalizedRole = role.toLowerCase().trim();
                localStorage.setItem("role", normalizedRole);

                if (username_from_data) localStorage.setItem("username", username_from_data);
                if (userId) localStorage.setItem("userId", userId);

                console.log("[LOGIN SUCCESS]", {
                    role: normalizedRole,
                    token_preview: token.substring(0, 10) + "...",
                    userId: userId
                });

                // Determine redirect URL based on role
                let redirectUrl = "index.html";
                if (normalizedRole === 'owner') {
                    redirectUrl = "owner.html";
                } else if (normalizedRole === 'cashier') {
                    redirectUrl = "cashier.html";
                } else if (normalizedRole === 'accountant') {
                    redirectUrl = "accountant.html";
                }

                setTimeout(() => {
                    window.location.replace(redirectUrl);
                }, 100);

            } catch (error) {
                const errorTranslations = {
                    'Login va parol kiritilishi shart!': "Login va parol kiritilishi shart!",
                    'Bunday foydalanuvchi mavjud emas!': "Bunday foydalanuvchi mavjud emas!",
                    'Login yoki parol xato!': "Login yoki parol xato!",
                    'Incorrect username or password': "Login yoki parol xato!",
                    'Failed to fetch': 'Server bilan bog\'lanishda xatolik',
                    'NetworkError': 'Internet aloqasi yo\'q',
                    'Network request failed': 'Server bilan bog\'lanishda xatolik',
                    'Unexpected token': 'Serverdan noto\'g\'ri javob (JSON emas)',
                    'is not valid JSON': 'Serverdan noto\'g\'ri javob (JSON emas)'
                };

                let errorMessage = error.message;
                for (const [key, value] of Object.entries(errorTranslations)) {
                    if (errorMessage.includes(key)) {
                        errorMessage = value;
                        break;
                    }
                }

                errorText.textContent = errorMessage;
                errorBox.classList.remove("hidden");
                console.error("[LOGIN ERROR]", error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Kirish";
            }
        }
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('[SW] Registered:', reg.scope))
                    .catch(err => console.warn('[SW] Registration failed:', err));
            });
        }
    </script>
</body>

</html>
